# hyprlock, styled to match the SilentSDDM login screen (system/sddm/rose-pine.conf):
# blurred wallpaper with clock and date like its lock screen, plus its password field.
# Positions are offsets from the screen center.

source = $HOME/.config/hypr/rose-pine.conf

general {
    grace = 1
}

# Blurred wallpaper
background {
    monitor =
    path = $HOME/.config/rofi/.current_wallpaper
    color = $base
    blur_passes = 2
    blur_size = 5
    brightness = 1.0
    contrast = 1.0
    vibrancy = 0.0
    noise = 0.0
}

# Clock
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 80
    font_family = Red Hat Display Black
    position = 0, 75
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %-d, %Y'
    color = $text
    font_size = 16
    font_family = Red Hat Display SemiBold
    position = 0, 5
    halign = center
    valign = center
}

# Password field. The outline is invisible until it turns gold (checking, Caps Lock) or red (wrong password).
input-field {
    monitor =
    size = 230, 35
    rounding = 12
    outline_thickness = 2
    outer_color = $overlay
    inner_color = $overlay
    font_color = $text
    font_family = Red Hat Display
    check_color = $gold
    fail_color = $love
    capslock_color = $gold
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = false
    fade_on_empty = false
    placeholder_text = <i><span foreground="##908caa" size="12pt">Password</span></i>
    fail_text = <span foreground="##eb6f92" size="12pt">$FAIL</span>
    position = 0, -75
    halign = center
    valign = center
}

